spring:
  application:
    name: llm-std-ait
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true
  ai:
    vectorstore:
      pgvector:
        ## 테이블 자동 구성여부
        initialize-schema: true
        dimensions: 768
        remove-existing-vector-store-table: false
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4:e4b-it-q8_0
      embedding:
        model: embeddinggemma:300m
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: postgres
server:
  port: 8080
---
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
